name: keylire
description: A logbook that knows what time it is. Local-first, no account.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # storage
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # on-device AI
  # Fork shipping ONNX Runtime 1.22, built for Android 16 KB page sizes.
  onnxruntime_plus: ^1.5.0
  google_mlkit_image_labeling: ^0.13.0
  google_mlkit_text_recognition: ^0.14.0
  speech_to_text: ^7.0.0

  # capture doors
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  home_widget: ^0.7.0

  # backup
  cryptography: ^2.7.0
  file_picker: ^8.1.2

  # optional cloud tier (dormant without a key; kept for v2)
  http: ^1.2.2
  purchases_flutter: ^8.0.0

  # authentication
  local_auth: ^2.3.0

  # reminders & notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/icon/

  fonts:
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/InstrumentSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InstrumentSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
