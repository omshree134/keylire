name = "keylire-cloud"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[kv_namespaces]]
binding = "USAGE"
id = "<create with: wrangler kv namespace create USAGE>"

[vars]
UPSTREAM_URL = "https://api.groq.com/openai/v1/chat/completions"
TEXT_MODEL = "llama-3.3-70b-versatile"
VISION_MODEL = "meta-llama/llama-4-scout-17b-16e-instruct"
RC_ENTITLEMENT = "premium"
CAP_TEXT = "400"
CAP_VISION = "150"
TOKEN_TTL_SECONDS = "86400"

# Secrets (wrangler secret put <NAME>):
#   UPSTREAM_KEY   - Groq/OpenAI key
#   RC_SECRET_KEY  - RevenueCat secret API key (sk_...)
#   JWT_SECRET     - 32+ random bytes, base64

